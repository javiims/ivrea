name: Update Ivrea RSS
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ivrea-rss
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    # A normal run takes about 1 minute; fail fast instead of hanging for 25 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      # Only BeautifulSoup is needed: no browser and no apt-get step.
      - name: Install Python packages
        run: pip install -r requirements.txt
        timeout-minutes: 3
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        timeout-minutes: 2
      - name: Detect new entries
        run: python scraper.py
        timeout-minutes: 4
        env:
          API_URL: 'https://editorialivrea.com/ESP/preguntas/wp-json/wp/v2/comments'
          API_COMMENTS: '100'
          FEED_LIMIT: '200'
          BASELINE_ITEMS: '10'
      - name: Save persistent state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json public/
          if ! git diff --cached --quiet; then
            git commit -m 'Update RSS detection state'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  # Publishing runs in its own job, after the upload above has finished.
  # GitHub sometimes does not yet list an artifact uploaded a moment earlier
  # ("No artifacts named github-pages were found", actions/deploy-pages#451),
  # so if that still happens, wait and try again before failing the run.
  publish:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publish1.outputs.page_url || steps.publish2.outputs.page_url || steps.publish3.outputs.page_url }}
    steps:
      - name: Publish feed
        id: publish1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying
        if: steps.publish1.outcome == 'failure'
        run: sleep 30
      - name: Publish feed (2nd try)
        id: publish2
        if: steps.publish1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before the last try
        if: steps.publish1.outcome == 'failure' && steps.publish2.outcome == 'failure'
        run: sleep 120
      - name: Publish feed (last try)
        id: publish3
        if: steps.publish1.outcome == 'failure' && steps.publish2.outcome == 'failure'
        uses: actions/deploy-pages@v5
